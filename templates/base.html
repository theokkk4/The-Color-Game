<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Color Game{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body {% block body_attrs %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="/">The Color Game</a>
    <nav>
      <a href="/leaderboard">Leaderboard</a>
    </nav>
  </header>

  <main class="page fade-in">
    {% block content %}{% endblock %}
  </main>

  <!-- Sounds. Drop real files into static/sounds/. Missing files are ignored. -->
  <audio id="snd-click"   src="{{ url_for('static', filename='sounds/click.wav') }}"   preload="auto"></audio>
  <audio id="snd-correct" src="{{ url_for('static', filename='sounds/correct.wav') }}" preload="auto"></audio>
  <audio id="snd-wrong"   src="{{ url_for('static', filename='sounds/wrong.wav') }}"   preload="auto"></audio>

  <!-- Socket.IO client. Version 4.x matches Flask-SocketIO 5.x. -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
