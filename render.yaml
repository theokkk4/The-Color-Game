# Render free web service. Render sets $PORT; app.py reads it.
services:
  - type: web
    name: the-color-game
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true
